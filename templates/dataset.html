<!DOCTYPE html>
<html>
<head>
    <title>Dataset Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="card">
    <h2>Dataset Auto Analysis</h2>

    <table border ="1" width="100%">
        <tr>
            <th>Post</th>
            <th>Sentiment</th>
        </tr>

        {% for post in posts %}
        <tr>
            <td>{{ post.text }}</td>
            <td>{{ post.sentiment }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
