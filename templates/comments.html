<!DOCTYPE html>
<html>
<head>
    <title>Analyze Comments</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* Matching navy gradient theme */
            background: linear-gradient(135deg, #0f1f3a, #1c355e);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 450px;
            padding: 30px;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);

            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            resize: none;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: #2d4a73;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: #3f5f8f;
        }

        .positive {
            color: #28a745;
            font-weight: bold;
            font-size: 20px;
        }

        .negative {
            color: #dc3545;
            font-weight: bold;
            font-size: 20px;
        }

        .neutral {
            color: #ffc107;
            font-weight: bold;
            font-size: 20px;
        }

        a {
            color: #9fc9ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Analyze Instagram Comment</h2>

    <form method="POST">
        <textarea name="comment" placeholder="Enter Instagram comment..." required></textarea>
        <br><br>
        <button type="submit">Analyze Comment</button>
    </form>

    {% if result %}
        <br>
        <div class="{{ result|lower }}">{{ result }}</div>
    {% endif %}

    <br>
    <a href="/">Back</a>
</div>

</body>
</html>
